<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GMK-COM - Inscription</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#EAF2FF] flex justify-center">
<div class="w-full max-w-[430px] bg-white min-h-screen">
<div class="bg-[#0A3A8A] text-center pt-8 pb-6 rounded-b-[35px]">
<div class="w-24 h-24 bg-white rounded-full mx-auto flex items-center justify-center"><span style="font-size:50px">🕊️</span></div>
<h1 class="text-[#D4AF37] text-[32px] font-black">GMK-COM</h1>
<p class="text-white font-bold">Peace Community</p>
</div>
<div class="p-5">
<h2 class="font-black text-center">Créer votre compte - Gratuit</h2>
<input id="nom" placeholder="Nom complet" class="w-full mt-4 p-3.5 rounded-full bg-[#F4F7FF] border">
<input id="email" type="email" placeholder="georgeskasso3@gmail.com" class="w-full mt-3 p-3.5 rounded-full bg-[#F4F7FF] border">
<div class="flex mt-3"><span class="bg-[#0A3A8A] text-white px-3 py-3.5 rounded-l-full">+233</span><input id="phone" placeholder="24 123 4567" class="flex-1 p-3.5 rounded-r-full bg-[#F4F7FF] border"></div>
<div class="relative mt-3"><input id="pass1" type="password" placeholder="Mot de passe" class="w-full p-3.5 rounded-full bg-[#F4F7FF] border pr-12"><span onclick="toggle('pass1')" class="absolute right-4 top-3.5 cursor-pointer">👁️</span></div>
<div class="relative mt-3"><input id="pass2" type="password" placeholder="Confirmer mot de passe" class="w-full p-3.5 rounded-full bg-[#F4F7FF] border pr-12"><span 
onclick="toggle('pass2')" class="absolute right-4 top-3.5 cursor-pointer">👁️</span></div>
<button onclick="alert('Compte créé!')" class="w-full bg-[#0A3A8A] text-white p-4 rounded-full font-black mt-6">S'INSCRIRE GRATUITEMENT</button>
</div>
</div>
<script>
function toggle(id){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';}
</script>
</body>
</html>
