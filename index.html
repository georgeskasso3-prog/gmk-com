<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GMK-COM</title><style>body{font-family:Arial;background:#eef2ff;margin:0;padding:10px}.box{background:white;padding:20px;border-radius:15px;max-width:550px;margin:10px auto;box-shadow:0 10px 30px rgba(0,0,0,0.1)}input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:2px solid #e5e7eb;box-sizing:border-box}button{padding:10px 15px;background:#1e3a8a;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.tel{display:flex;gap:8px}.tel select{width:40%}.tel input{width:60%}.post{border:1px solid #e5e7eb;padding:15px;border-radius:12px;margin:12px 0}.actions{display:flex;gap:8px;margin-top:8px;border-top:1px solid #eee;padding-top:8px}.actions button{background:#f3f4f6;color:#333;font-size:13px}.hidden{display:none}</style></head><body>
  <div id="inscription" class="box"><h1>🕊️ GMK-COM</h1><p style="text-align:center">Inscription Mondiale</p><input id="nom" placeholder="Nom complet"><div class="tel"><select id="indicatif"><option value="+233">🇬🇭 +233 Ghana</option><option value="+225">🇨🇮 +225 CIV</option><option value="+228">🇹🇬 +228 Togo</option><option value="+229">🇧🇯 +229 Bénin</option><option value="+226">🇧🇫 +226 Burkina</option><option value="+221">🇸🇳 +221 Sénégal</option><option value="+224">🇬🇳 +224 Guinée</option><option value="+242">🇨🇬 +242 Congo</option><option value="+243">🇨🇩 +243 RDC</option><option value="+237">🇨🇲 +237 Cameroun</option><option value="+234">🇳🇬 +234 Nigeria</option><option value="+33">🇫🇷 +33 France</option><option value="+32">🇧🇪 +32 Belgique</option><option value="+1">🇺🇸 +1 USA</option><option value="+44">🇬🇧 +44 UK</option><option value="+49">🇩🇪 +49 Allemagne</option><option value="+212">🇲🇦 +212 Maroc</option><option value="+216">🇹🇳 +216 Tunisie</option><option value="+27">🇿🇦 +27 SA</option></select><input id="tel" placeholder="Numéro"></div><input id="p1" type="password" 
  placeholder="Mot de passe"><button style="width:100%" onclick="inscrire()">REJOINDRE 🌍</button></div>

<div id="reseau" class="box hidden"><h1>🕊️ GMK-COM</h1><p>Salut <b id="myName"></b> 👋</p><textarea id="postText" placeholder="Quoi de neuf?"></textarea><button style="width:100%" onclick="poster()">PUBLIER 🚀</button><div id="feed">Chargement feed mondial...</div><hr><h4>💬 Chat Mondial</h4><input id="chatMsg" placeholder="Message..."><button onclick="chat()">Envoyer</button><div id="chatBox"></div><button onclick="localStorage.clear();location.reload()" style="background:#ef4444;width:100%;margin-top:15px">Déconnexion</button></div>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDemoKey", authDomain: "gmk-com-demo.firebaseapp.com", projectId: "gmk-com-demo" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let current = JSON.parse(localStorage.getItem('gmk_current')||'null');
if(current){ document.getElementById('inscription').classList.add('hidden'); document.getElementById('reseau').classList.remove('hidden'); document.getElementById('myName').innerText=current.nom; }
    window.inscrire=async()=>{let n=document.getElementById('nom').value.trim(),i=document.getElementById('indicatif').value,t=document.getElementById('tel').value.trim();if(!n||!t){alert('Remplis tout');return}let full=i+t;current={nom:n,tel:full};localStorage.setItem('gmk_current',JSON.stringify(current));document.getElementById('inscription').classList.add('hidden');document.getElementById('reseau').classList.remove('hidden');document.getElementById('myName').innerText=n;await addDoc(collection(db,"membres"),{nom:n,tel:full,date:serverTimestamp()});}
window.poster=async()=>{let txt=document.getElementById('postText').value.trim();if(!txt)return;await addDoc(collection(db,"posts"),{auteur:current.nom,tel:current.tel,texte:txt,likes:0,date:serverTimestamp()});document.getElementById('postText').value='';}
window.chat=async()=>{let 
 m=document.getElementById('chatMsg').value.trim();if(!m)return;await addDoc(collection(db,"chat"),{auteur:current.nom,msg:m,date:serverTimestamp()});document.getElementById('chatMsg').value='';}
onSnapshot(query(collection(db,"posts"),orderBy("date","desc")),(snap)=>{let h='';snap.forEach(d=>{let p=d.data();h+=`<div class="post"><b>${p.auteur}</b> <small>${p.tel}</small><p>${p.texte}</p><div class="actions"><button onclick="likePost('${d.id}',${p.likes||0})">👍 Like (${p.likes||0})</button><button>💬 Commenter</button></div></div>`});document.getElementById('feed').innerHTML=h||'Pas encore de post, sois le 1er!';});
onSnapshot(query(collection(db,"chat"),orderBy("date","asc")),(snap)=>{let h='';snap.forEach(d=>{let c=d.data();h+=`<div style="padding:4px"><b>${c.auteur}:</b> ${c.msg}</div>`});document.getElementById('chatBox').innerHTML=h;});
window.likePost=async(id,l)=>{await updateDoc(doc(db,"posts",id),{likes:l+1});}
</script></body></html>
