<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GMK-COM</title><style>body{margin:0;font-family:Arial;background:#f5f7ff}.card{background:#fff;padding:15px;margin:10px;border-radius:12px}.btn{background:#0052cc;color:#fff;padding:12px;border:none;border-radius:10px;width:100%;font-weight:bold}.tab{position:fixed;bottom:0;width:100%;display:flex;background:#fff;border-top:1px solid #ccc}.tab button{flex:1;padding:14px;border:none}</style></head><body><div id="app"></div><script>
const NGOS={"HUMANITAIRE":[{n:"UNHCR",u:"https://www.unhcr.org"},{n:"IRC",u:"https://www.rescue.org"},{n:"NRC",u:"https://www.nrc.no"}],"SANTE":[{n:"MSF",u:"https://www.msf.org"},{n:"ACF",u:"https://www.actioncontrelafaim.org"}],"ENFANCE":[{n:"UNICEF",u:"https://www.unicef.org"},{n:"Save Children",u:"https://www.savethechildren.net"}],"DEVELOPPEMENT":[{n:"CARE",u:"https://www.care-international.org"},{n:"OXFAM",u:"https://www.oxfam.org"}],"DROITS":[{n:"Amnesty",u:"https://www.amnesty.org"},{n:"WWF",u:"https://www.wwf.org"}]}
let tab='fil';let coachRep='';
function render(){let c='';if(tab=='fil')c=`<div class="card"><b>Aminata K.</b><p>200 arbres plantés 🌱</p>❤️24 💬8</div><div class="card"><input placeholder="Publier..." 
style="width:90%;padding:10px"><button class="btn" style="margin-top:8px">Publier</button></div>`;if(tab=='chat')c=`<div class="card"><h3>Chats & Appels</h3><p>Textos, vocaux, vidéos, appels groupés</p><button class="btn" style="background:#25D366">Nouveau message</button></div>`;if(tab=='ngo'){let l='';for(let k in NGOS){l+=`<div class="card"><b>${k}</b>`+NGOS[k].map(o=>`<a href="${o.u}" target="_blank" style="display:block;margin:6px;color:#0052cc">🌐 ${o.n} → ${o.u}</a>`).join('')+`</div>`}c=`<div class="card"><h3>NGOs CONNECT</h3><input placeholder="Date création" style="width:90%;padding:8px;margin:4px"><input placeholder="N° récépissé" style="width:90%;padding:8px;margin:4px"><input placeholder="Domaine" style="width:90%;padding:8px;margin:4px"><input placeholder="Poste" style="width:90%;padding:8px;margin:4px"><button class="btn">Vérifier</button></div>${l}`;}if(tab=='coach')c=`<div class="card"><h3>GMK-COACH</h3><textarea id="q" style="width:90%;height:70px" placeholder="Ton coeur..."></textarea><button class="btn" onclick="doCoach()">Encouragement</button><div style="margin-top:10px;background:#eef2ff;padding:10px;border-radius:8px;white-space:pre-wrap">${coachRep}</div></div>`;document.getElementById('app').innerHTML=`<div style="text-align:center;padding:20px;background:linear-
gradient(white,#dbe6ff)"><div style="font-size:50px">🕊️</div><h1 style="color:#0a2a6b">GMK-COM</h1><h3>BIENVENUE dans la Communauté GMK-COM!</h3><p>La Vision Nouvelle de la communication communautaire.</p><p style="color:#0052cc;font-weight:bold;border:2px dashed #0052cc;padding:10px;border-radius:10px;background:#fff">AVEC GMK-COM, ENSEMBLE NOUS IRONS PLUS LOIN!</p></div><div style="padding-bottom:60px">${c}</div><div class="tab"><button onclick="tab='fil';render()" style="${tab=='fil'?'background:#0052cc;color:white':''}">Fil</button><button onclick="tab='chat';render()" style="${tab=='chat'?'background:#0052cc;color:white':''}">Chats</button><button onclick="tab='ngo';render()" style="${tab=='ngo'?'background:#0052cc;color:white':''}">NGOs</button><button onclick="tab='coach';render()" style="${tab=='coach'?'background:#0052cc;color:white':''}">Coach</button></div>`;}
function doCoach(){let q=document.getElementById('q').value;coachRep=`J'entends: "${q}"\n\n📖 BIBLE: Fortifie-toi et prends courage (Josué 1:9)\n\n📖 CORAN: Avec la difficulté vient la facilité (94:6)\n\n💙 Bois de l'eau, respire, tu n'es pas seul dans GMK-COM.`;render();}render();
</script></body></html>
