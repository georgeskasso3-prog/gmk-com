<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GMK-COM</title><style>body{font-family:Arial;background:#eef2ff;margin:0;padding:8px}.box{background:white;padding:15px;border-radius:12px;max-width:500px;margin:auto}.post{border:1px solid #ddd;padding:10px;border-radius:10px;margin:10px 0}input,textarea,select{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{padding:9px 12px;background:#1e3a8a;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer}.cmt{background:#f3f4f6;padding:5px;border-radius:5px;margin:3px 0;font-size:13px}</style></head><body>
<div id="insc" class="box"><h2>🕊️ GMK-COM Inscription</h2>
<input id="nom" placeholder="Nom complet">
<input id="email" type="email" placeholder="Ton E-MAIL (ex: toi@gmail.com)">
<div style="display:flex;gap:5px"><select id="ind" style="width:40%"><option value="+233">🇬🇭 +233</option><option value="+225">🇨🇮 +225</option><option value="+228">🇹🇬 +228</option><option value="+229">🇧🇯 +229</option><option value="+33">🇫🇷 +33</option><option value="+1">🇺🇸 +1</option></select><input id="tel" placeholder="Numéro" style="width:60%"></div>
<div style="display:flex;align-items:center;position:relative"><input id="pass" type="password" placeholder="Mot de passe" style="padding-right:40px"><span onclick="if(pass.type=='password'){pass.type='text';this.innerText='🙈'}else{pass.type='password';this.innerText='👁️'}" style="position:absolute;right:10px;cursor:pointer;font-size:20px">👁️</span></div>
<button style="width:100%" onclick="go()">S'INSCRIRE AVEC E-MAIL 🌍</button></div>
<div id="app" class="box" style="display:none"><h2>GMK-COM</h2><p>Salut <b id="me"></b>! Email: <span id="myEmail"></span></p><textarea id="txt" placeholder="Quoi de neuf?"></textarea><input type="file" id="file" accept="image/*,video/*"><div id="prev"></div><button style="width:100%" onclick="post()">PUBLIER 🚀</button><div id="feed"></div></div>
<script>
let moi=JSON.parse(localStorage.getItem('gmk')||'null'),posts=JSON.parse(localStorage.getItem('posts')||'[]'),med=null,medType=null;
if(moi){insc.style.display='none';app.style.display='block';me.innerText=moi.nom;myEmail.innerText=moi.email;show();}
file.onchange=e=>{let f=e.target.files[0];let r=new FileReader();r.onload=x=>{med=x.target.result;medType=f.type.includes('video')?'video':'photo';prev.innerHTML=medType=='photo'?`<img src="${med}" style="width:100%">`:`<video src="${med}" controls 
style="width:100%">`};r.readAsDataURL(f);}
function go(){let n=nom.value,e=email.value,t=tel.value,p=pass.value;if(!n||!e||!t)return alert('Remplis Nom + Email + Tel');moi={nom:n,email:e,tel:ind.value+t,pass:p};localStorage.setItem('gmk',JSON.stringify(moi));insc.style.display='none';app.style.display='block';me.innerText=n;myEmail.innerText=e;show();}
function post(){let t=txt.value;if(!t&&!med)return;posts.push({id:Date.now(),auteur:moi.nom,email:moi.email,texte:t,media:med,type:medType,likes:0,coms:[]});localStorage.setItem('posts',JSON.stringify(posts));txt.value='';prev.innerHTML='';med=null;show();}
function like(id){let p=posts.find(x=>x.id==id);p.likes++;localStorage.setItem('posts',JSON.stringify(posts));show();}
function commenter(id){let c=prompt('Ton commentaire:');if(!c)return;let p=posts.find(x=>x.id==id);p.coms.push({a:moi.nom,t:c});localStorage.setItem('posts',JSON.stringify(posts));show();}
function show(){let h='';posts.slice().reverse().forEach(p=>{let m=p.media?(p.type=='photo'?`<img src="${p.media}" style="width:100%;border-radius:8px">`:`<video src="${p.media}" controls style="width:100%">`):'';let cm=p.coms.map(x=>`<div class="cmt"><b>${x.a}:</b> ${x.t}</div>`).join('');h+=`<div class="post"><b>${p.auteur}</b> <small>${p.email}</small><p>${p.texte||''}</p>${m}<br><button onclick="like(${p.id})">👍 ${p.likes}</button> <button onclick="commenter(${p.id})">💬 Commenter (${p.coms.length})</button><div>${cm}</div></div>`});feed.innerHTML=h||'Pas encore de post';}
</script></body></html>
