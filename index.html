<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GMK-COM</title><style>body{font-family:Arial;background:#eef2ff;margin:0;padding:10px}.box{background:white;padding:20px;border-radius:15px;max-width:550px;margin:10px auto}.post{border:1px solid #e5e7eb;padding:15px;border-radius:12px;margin:12px 0;background:white}.post img,.post video{width:100%;border-radius:10px;margin-top:8px;max-height:400px;object-fit:cover}input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:2px solid #e5e7eb;box-sizing:border-box}button{padding:10px 15px;background:#1e3a8a;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:2px}.tel{display:flex;gap:8px}.tel select{width:45%}.actions{display:flex;gap:8px;margin-top:8px;border-top:1px solid #eee;padding-top:8px}.actions 
  button{background:#f3f4f6;color:#333;font-size:13px}.hidden{display:none}</style></head><body>
<div id="inscription" class="box"><h1>🕊️ GMK-COM</h1><p style="text-align:center">Réseau Mondial</p><input id="nom" placeholder="Nom complet"><div class="tel"><select id="indicatif"><option value="+233">🇬🇭 +233</option><option value="+225">🇨🇮 +225</option><option value="+228">🇹🇬 +228</option><option value="+229">🇧🇯 +229</option><option value="+226">🇧🇫 +226</option><option value="+33">🇫🇷 +33</option><option value="+1">🇺🇸 +1</option><option value="+44">🇬🇧 +44</option><option value="+212">🇲🇦 +212</option></select><input id="tel" placeholder="Numéro"></div><input id="p1" type="password" placeholder="Mot de passe"><button style="width:100%" onclick="inscrire()">REJOINDRE 🌍</button></div>
<div id="reseau" class="box hidden"><h1>🕊️ GMK-COM</h1><p>Salut <b id="myName"></b> 👋</p><textarea id="postText" placeholder="Quoi de neuf?"></textarea><div style="display:flex;gap:5px"><label style="flex:1;background:#e0f2fe;padding:10px;border-radius:8px;text-align:center;cursor:pointer">📷 Photo <input type="file" id="photoInput" accept="image/*" hidden></label><label style="flex:1;background:#fce7f3;padding:10px;border-radius:8px;text-align:center;cursor:pointer">🎥 Vidéo <input type="file" id="videoInput" accept="video/*" hidden></label></div><div id="preview"></div><button style="width:100%;margin-top:8px" onclick="poster()">PUBLIER 🚀</button><div id="feed"></div><hr><h4>💬 Chat Mondial</h4><input id="chatMsg" placeholder="Message..."><button onclick="chat()">Envoyer</button><div id="chatBox"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDemoKey", authDomain: "gmk-com-demo.firebaseapp.com", projectId: "gmk-com-demo" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let current = JSON.parse(localStorage.getItem('gmk_current')||'null'); let mediaData=null, mediaType=null;
if(current){inscription.classList.add('hidden');reseau.classList.remove('hidden');myName.innerText=current.nom;}
    photoInput.onchange=e=>{let f=e.target.files[0];let r=new FileReader();r.onload=ev=>{mediaData=ev.target.result;mediaType='photo';preview.innerHTML=`<img src="${mediaData}" style="width:100%;border-radius:10px;margin-top:8px">`};r.readAsDataURL(f);}
videoInput.onchange=e=>{let f=e.target.files[0];let r=new FileReader();r.onload=ev=>{mediaData=ev.target.result;mediaType='video';preview.innerHTML=`<video src="${mediaData}" controls style="width:100%;border-radius:10px;margin-top:8px"></video>`};r.readAsDataURL(f);}
window.inscrire=async()=>{let n=nom.value.trim(),i=indicatif.value,t=tel.value.trim();if(!n||!t)return alert('Remplis');let full=i+t;current={nom:n,tel:full};localStorage.setItem('gmk_current',JSON.stringify(current));inscription.classList.add('hidden');reseau.classList.remove('hidden');myName.innerText=n;await addDoc(collection(db,"membres"),{nom:n,tel:full,date:serverTimestamp()});}
window.poster=async()=>{let txt=postText.value.trim();if(!txt&&!mediaData)return;await 
  addDoc(collection(db,"posts"),{auteur:current.nom,tel:current.tel,texte:txt,media:mediaData,type:mediaType,likes:0,date:serverTimestamp()});postText.value='';preview.innerHTML='';mediaData=null;mediaType=null;}
window.chat=async()=>{let m=chatMsg.value.trim();if(!m)return;await addDoc(collection(db,"chat"),{auteur:current.nom,msg:m,date:serverTimestamp()});chatMsg.value='';}
onSnapshot(query(collection(db,"posts"),orderBy("date","desc")),(snap)=>{let h='';snap.forEach(d=>{let p=d.data();let med='';if(p.media){if(p.type=='photo')med=`<img src="${p.media}">`;else med=`<video src="${p.media}" controls></video>`}h+=`<div class="post"><b>${p.auteur}</b> <small>${p.tel}</small><p>${p.texte||''}</p>${med}<div class="actions"><button onclick="likePost('${d.id}',${p.likes||0})">👍 Like (${p.likes||0})</button><button>💬 Commenter</button></div></div>`});feed.innerHTML=h||'Pas encore de post';});
  onSnapshot(query(collection(db,"chat"),orderBy("date","asc")),(snap)=>{let h='';snap.forEach(d=>{let c=d.data();h+=`<div><b>${c.auteur}:</b> ${c.msg}</div>`});chatBox.innerHTML=h;});
window.likePost=async(id,l)=>{await updateDoc(doc(db,"posts",id),{likes:l+1});}
</script></body></html>
