<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GMK-COM V4 - Super Big Host</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f0f2f5;margin:0}
.header{background:#1877f2;color:#fff;padding:12px 15px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;padding:15px;border-radius:12px;margin:12px auto;max-width:640px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
textarea,input{width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;margin:6px 0;font-size:16px}
button{border:none;padding:9px 14px;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px;color:#fff}
.btn-post{background:#1877f2;width:100%;font-size:16px;padding:12px}
.yt{aspect-ratio:16/9;width:100%;border:none;border-radius:10px;margin-top:8px;background:#000}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.actions button{background:#e4e6eb;color:#050505}
.com{font-size:14px;background:#f0f2f5;padding:8px 12px;border-radius:16px;margin:6px 0}
.badge{background:#42b72a;color:#fff;padding:3px 8px;border-radius:10px;font-size:11px}
</style>
</head>
<body>
<div class="header"><h1>🕊️ GMK-COM</h1><span class="badge">V4 • SUPER BIG HOST</span></div>
<div class="card">
<textarea id="texte" rows="3" placeholder="Quoi de neuf? Colle ton texte et ton lien YouTube ici..."></textarea>
<input id="ytlink" placeholder="Lien YouTube optionnel: https://youtu.be/...">
<input type="file" id="file" accept="image/*,video/*">
<div style="font-size:12px;color:#666">Image, vidéo, ou lien YouTube - illimité!</div>
<button class="btn-post" onclick="poster()" id="btnPost">📤 PUBLIER SUR GMK-COM</button>
<div id="status" style="text-align:center;margin-top:8px;font-weight:bold"></div>
</div>
<div id="feed"></div>
<script>
const SUPABASE_URL = "https://humvsmyveyyezirlpvhy.supabase.co";
const SUPABASE_KEY = "sb_publishable_wPcY1F68QBH4uxyI-nM7Hw_eDifFrEQ";
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
function ytId(url){ if(!url) return null; let m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([^&\s?]+)/); return m?m[1]:null; }
async function poster(){
 const 
t=document.getElementById('texte').value.trim(); const ytRaw=document.getElementById('ytlink').value.trim()||t; const file=document.getElementById('file').files[0];
 const btn=document.getElementById('btnPost'); const status=document.getElementById('status');
 if(!t &&!file &&!ytRaw){ alert("Écris quelque chose!"); return;} btn.disabled=true; btn.innerText="Envoi..."; status.innerText="⏳ Upload...";
 try{ let image_url=null, video_url=null, youtube_url=null; let yid=ytId(ytRaw); if(yid) youtube_url="https://www.youtube.com/watch?v="+yid;
 if(file){ let name=Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_"); let {error}=await supa.storage.from('gmk-media').upload(name,file); if(error) throw error; let {data}=supa.storage.from('gmk-media').getPublicUrl(name); if(file.type.startsWith('video')) video_url=data.publicUrl; else image_url=data.publicUrl; }
 let {error}=await 
 supa.from('posts').insert({texte:t, image_url, video_url, youtube_url}); if(error) throw error;
 status.innerText="✅ Publié!"; status.style.color="green"; document.getElementById('texte').value=""; document.getElementById('ytlink').value=""; document.getElementById('file').value=""; setTimeout(()=>status.innerText="",3000); load();
 }catch(e){ status.innerText="❌ "+e.message; status.style.color="red";} btn.disabled=false; btn.innerText="📤 PUBLIER SUR GMK-COM";
}
async function react(id,field){ try{ let {data}=await supa.from('posts').select('likes,dislikes').eq('id',id).single(); let upd={}; upd[field]=(data[field]||0)+1; await supa.from('posts').update(upd).eq('id',id); load(); }catch(e){alert(e.message)} }
async function commenter(pid){ let txt=prompt("Ton commentaire:"); if(!txt) return; await supa.from('commentaires').insert({post_id:pid, texte:txt}); load(); }
async function load(){
let {data:posts,error}=await supa.from('posts').select('*').order('created_at',{ascending:false}); if(error){document.getElementById('feed').innerHTML="<div class=card>❌ "+error.message+"</div>";return;}
 let html=""; for(let p of posts){ let yid=ytId(p.youtube_url); let shareTxt=encodeURIComponent((p.texte||"Regarde sur GMK-COM")+" "+(p.youtube_url||""));
 html+=`<div class="card"><div style="font-weight:bold">🕊️ GMK-COM <span style="color:#65676b;font-size:12px">• ${new Date(p.created_at).toLocaleString('fr-FR')}</span></div><div style="white-space:pre-wrap">${(p.texte||"").replace(/</g,"&lt;")}</div>${p.image_url?`<img src="${p.image_url}" style="width:100%;border-radius:10px;margin-top:8px">`:""}${p.video_url?`<video src="${p.video_url}" controls style="width:100%;border-radius:10px;margin-top:8px"></video>`:""}${yid?`<iframe class="yt" src="https://www.youtube.com/embed/${yid}" allowfullscreen></iframe>`:""}<div class="actions"><button onclick="react(${p.id},'likes')">❤️ ${p.likes||0}</button><button onclick="react($ 
{p.id},'dislikes')">👎 ${p.dislikes||0}</button><button onclick="commenter(${p.id})">💬 Commenter</button><a href="https://wa.me/?text=${shareTxt}" target="_blank"><button style="background:#25D366">📱 WhatsApp</button></a><a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(p.youtube_url||p.image_url||'')}" target="_blank"><button style="background:#1877f2">📘 Facebook</button></a></div><div id="com-${p.id}"></div></div>`; }
 document.getElementById('feed').innerHTML=html||"<div class=card style=text-align:center>Aucun post. Sois le premier! 🚀</div>";
 for(let p of posts){ let {data:coms}=await supa.from('commentaires').select('*').eq('post_id',p.id).order('created_at'); if(coms&&coms.length){document.getElementById(`com-${p.id}`).innerHTML=coms.map(c=>`<div class="com">💬 ${c.texte.replace(/</g,"&lt;")}</div>`).join("");}}
}
load();
</script></body></html>
