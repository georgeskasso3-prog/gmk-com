<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GMK-COM</title><style>body{font-family:Arial;background:linear-gradient(135deg,#1e3a8a,#3b82f6);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:20px}.box{background:white;padding:30px;border-radius:20px;max-width:400px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,0.2)}h1{text-align:center;color:#1e3a8a}input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:2px solid #e5e7eb;box-sizing:border-box}button{width:100%;padding:14px;background:#1e3a8a;color:white;border:none;border-radius:12px;font-weight:bold;cursor:pointer;margin-top:10px}.pwd{position:relative}.pwd span{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer}</style></head><body><div class="box"><h1>🕊️ GMK-COM</
  h1><p style="text-align:center">Inscription Gratuite</p><input id="nom" placeholder="Nom complet *"><input id="tel" placeholder="Téléphone *"><div class="pwd"><input id="p1" type="password" placeholder="Mot de passe *"><span onclick="this.previousElementSibling.type=this.previousElementSibling.type==='password'?'text':'password'">👁️</span></div><div class="pwd"><input id="p2" type="password" placeholder="Confirmer *"><span onclick="this.previousElementSibling.type=this.previousElementSibling.type==='password'?'text':'password'">👁️</span></div><button onclick="inscrire()">S'INSCRIRE GRATUITEMENT</button><p style="text-align:center;font-size:12px;margin-top:15px"><a href="dashboard.html">Espace privé</a></p></div><script>function inscrire(){let n=document.getElementById('nom').value.trim(),t=document.getElementById('tel').value.trim(),a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(!n||!t||!a){alert('Remplis tout!');return}if(a!==b)
  {alert('Remplis tout!');return}if(a!==b){alert('Mots de passe différents!');return}let users=JSON.parse(localStorage.getItem('gmk_users')||'[]');users.push({nom:n,tel:t,date:new Date().toISOString()});localStorage.setItem('gmk_users',JSON.stringify(users));alert('Compte créé! '+n+' Bienvenue 🕊️');document.getElementById('nom').value='';document.getElementById('tel').value='';document.getElementById('p1').value='';document.getElementById('p2').value='';}</script></body></html>
